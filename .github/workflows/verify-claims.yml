name: Claim verification (nightly)

# Nightly LLM-assisted verification that every cited claim with a verbatim
# `excerpt` is actually supported by that excerpt. The job is a *reporter*
# — it never blocks merges. Findings are uploaded as a JSON artifact for
# editorial triage.
#
# Run on demand from the Actions tab. Schedule fires once daily at 03:17 UTC
# so we get a fresh report each morning without colliding with CI peaks.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Lovable AI model id"
        required: false
        default: "google/gemini-2.5-flash"
      limit:
        description: "Max triples to verify (0 = all)"
        required: false
        default: "0"

jobs:
  verify:
    name: Verify cited claims against source excerpts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verifier
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: |
          node scripts/verify-claims.mjs \
            --model "${{ github.event.inputs.model || 'google/gemini-2.5-flash' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: claim-verification-report
          path: scripts/claim-verification-report.json
          if-no-files-found: error
          retention-days: 30
