name: Lighthouse & SEO CI

# Pre-release regression gate: build the app, serve it locally, and run
# Lighthouse CI against key routes with assertions. Fails the PR/push if
# performance, accessibility, best-practices, or SEO scores drop below
# the thresholds in .lighthouserc.json. Complements the post-publish
# lighthouse.yml workflow (which only measures production after deploy).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI — desktop
        id: lhci_desktop
        run: lhci autorun --config=./.lighthouserc.json
        continue-on-error: true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

      - name: Run Lighthouse CI — mobile
        id: lhci_mobile
        run: lhci autorun --config=./.lighthouserc.mobile.json
        continue-on-error: true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}


      - name: Generate Lighthouse summary
        if: always()
        run: node scripts/lighthouse-summary.mjs --out lhci-summary.md

      - name: Assert homepage hero drives LCP
        id: hero_lcp
        if: always()
        run: node scripts/check-hero-lcp.mjs --out hero-lcp-summary.md
        continue-on-error: true

      - name: Combine summaries
        if: always()
        run: |
          {
            cat lhci-summary.md
            echo ""
            [ -f hero-lcp-summary.md ] && cat hero-lcp-summary.md
          } > lhci-summary.combined.md
          mv lhci-summary.combined.md lhci-summary.md

      - name: Publish summary to job page
        if: always()
        run: cat lhci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-ci
          path: lhci-summary.md

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report-${{ github.run_id }}
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail job if any Lighthouse run failed
        if: always() && (steps.lhci_desktop.outcome == 'failure' || steps.lhci_mobile.outcome == 'failure')
        run: exit 1


