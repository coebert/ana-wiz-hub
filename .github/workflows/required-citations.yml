name: Required-citations regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  required-citations:
    name: fixed audit findings still cited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Required-citations snapshot test
        # Fails when a topic file has lost a reference label that was
        # required to close a topic_audit_findings row (status='fixed').
        # Snapshot lives at scripts/required-citations.snapshot.json and
        # is regenerated with `npm run gen:required-citations`.
        run: bunx vitest run src/__tests__/required-citations.test.ts
