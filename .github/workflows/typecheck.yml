name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tsc:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        # Fails the build on any type error, including ExamTag mismatches
        # (e.g. "ficm" vs "fficm") thanks to the literal-union type in
        # src/data/curriculum.ts.
        run: bunx tsc --noEmit

  format:
    name: prettier --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier formatting check
        # Fails the build if any tracked file differs from .prettierrc.json.
        # Run `npm run format` locally to fix.
        run: bunx prettier --check .

  safety-citations:
    name: Safety-critical citation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run safety-citation check
        # Fails the build if any topic file contains new uncited safety-critical
        # numeric claims (doses, rates, thresholds, energies) beyond the baseline
        # recorded in scripts/safety-citations-allowlist.json.
        # Fix by adding an <InlineRef />, <Cite />, or cites: [...] within ±6 lines
        # of the flagged number, then update the allowlist if the drop is genuine.
        run: node scripts/check-safety-citations.mjs
