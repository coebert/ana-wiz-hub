name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tsc:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        # Fails the build on any type error, including ExamTag mismatches
        # (e.g. "ficm" vs "fficm") thanks to the literal-union type in
        # src/data/curriculum.ts.
        run: bunx tsc --noEmit
