name: SEO regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  seo-regression:
    name: heading order + meta tag coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SEO regression tests
        # Static audit of src/pages and index.html. Fails on:
        #  - missing <h1> in TopicTemplate / SectionLayout
        #  - heading-level skips (h1 → h3, h2 → h4) outside the allowlist
        #  - missing sitewide title/description/og:* in index.html
        #  - any indexable route lacking per-route title / description /
        #    canonical / og:url (or layout that supplies them)
        run: bunx vitest run src/test/seo-regression.test.ts
