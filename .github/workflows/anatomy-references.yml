name: Curated anatomy reference records

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/data/references.ts'
      - 'src/data/curriculum.ts'
      - 'src/data/anatomyReferences.ts'
      - 'src/data/anatomyDiagramSources.generated.json'
      - 'scripts/check-anatomy-references.ts'
      - '.github/workflows/anatomy-references.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/references.ts'
      - 'src/data/curriculum.ts'
      - 'src/data/anatomyReferences.ts'
      - 'src/data/anatomyDiagramSources.generated.json'
      - 'scripts/check-anatomy-references.ts'
      - '.github/workflows/anatomy-references.yml'

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Check curated records without AI
        run: bun run check:anatomy-references
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-anatomy-reference-records
          path: data-build/anatomy-reference-report.json
          if-no-files-found: error
          retention-days: 30