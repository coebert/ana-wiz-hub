<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">Supraclavicular region relationship schematic</title><desc id="desc">The plexus lies usually lateral and posterior to the subclavian artery at the first rib. Both lie above the rib. Pleura is distinct and deeper; a rib is not a universal barrier under every possible approach. This is not an ultrasound image.</desc><rect width="900" height="700" fill="#f7fafc"/><text x="40" y="55" fill="#173045" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Supraclavicular region</text><text x="40" y="89" fill="#526477" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Relative anatomy near the first rib; layout is conceptual.</text><rect x="40" y="108" width="820" height="44" rx="10" fill="#e1f3f2"/><text x="58" y="137" fill="#087e83" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">RELATIONSHIP MAP · NOT AN ULTRASOUND IMAGE · NOT TO SCALE</text><rect x="70" y="204" width="300" height="90" rx="15" fill="#fce1e0" stroke="#b6c6d1"/><text x="220.0" y="256.0" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Subclavian artery</text><rect x="465" y="204" width="365" height="90" rx="15" fill="#fff1b8" stroke="#b6c6d1"/><text x="647.5" y="256.0" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Plexus trunks / divisions</text><text x="450" y="331" fill="#173045" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Plexus usually lateral and posterior to artery</text><text x="450" y="377" fill="#526477" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">BOTH ABOVE THE FIRST RIB</text><rect x="250" y="400" width="400" height="62" rx="15" fill="#e5e1d4" stroke="#b6c6d1"/><text x="450.0" y="438.0" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">First rib</text><rect x="130" y="504" width="640" height="51" rx="15" fill="#e2f1f5" stroke="#b6c6d1"/><text x="450.0" y="536.5" fill="#173045" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Pleura — deeper; identify separately</text><text x="40" y="593" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Vertical order expresses depth; shapes do not represent a scan plane.</text><text x="40" y="619" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Rib, its acoustic shadow and adjacent pleura are distinct ultrasound landmarks.</text><text x="40" y="674" fill="#526477" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Source: Society for Pediatric Anesthesia, Supraclavicular Case Guide (created 2022).</text></svg>