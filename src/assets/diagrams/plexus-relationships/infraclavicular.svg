<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">Infraclavicular region relationship schematic</title><desc id="desc">Pectoralis major is superficial to pectoralis minor. The three brachial plexus cords and axillary vessels lie deep to pectoralis minor. No fixed angular or clock-face positions of individual cords are represented.</desc><rect width="900" height="700" fill="#f7fafc"/><text x="40" y="55" fill="#173045" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Infraclavicular region</text><text x="40" y="89" fill="#526477" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Typical depth relationships at the lateral infraclavicular level.</text><rect x="40" y="108" width="820" height="44" rx="10" fill="#e1f3f2"/><text x="58" y="137" fill="#087e83" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">RELATIONSHIP MAP · NOT AN ULTRASOUND IMAGE · NOT TO SCALE</text><text x="40" y="192" fill="#526477" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Superficial / anterior</text><rect x="180" y="210" width="610" height="63" rx="15" fill="#e7eef4" stroke="#b6c6d1"/><text x="485.0" y="248.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Pectoralis major</text><rect x="180" y="293" width="610" height="63" rx="15" fill="#e7eef4" stroke="#b6c6d1"/><text x="485.0" y="331.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Pectoralis minor</text><rect x="180" y="386" width="610" height="150" rx="16" fill="#ffffff" stroke="#b6c6d1"/><rect x="199" y="403" width="216" height="114" rx="15" fill="#fce1e0" stroke="#b6c6d1"/><text x="307.0" y="467.0" fill="#173045" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Axillary vessels</text><rect x="437" y="403" width="333" height="114" rx="15" fill="#fff1b8" stroke="#b6c6d1"/><text x="603.5" y="452.5" fill="#173045" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Three cords:</text><text x="603.5" y="481.5" fill="#173045" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">lateral · posterior · medial</text><text x="40" y="555" fill="#526477" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Deep / posterior</text><text x="40" y="593" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Cord names do not prescribe clock positions on an ultrasound screen.</text><text x="40" y="619" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Individual cord and vein locations vary with anatomy, plane and arm position.</text><text x="40" y="674" fill="#526477" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sources: Sandhu &amp; Capan 2002 (PMID 12378663); Di Filippo et al. 2012 (PMID 22240617).</text></svg>