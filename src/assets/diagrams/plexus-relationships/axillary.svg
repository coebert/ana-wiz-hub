<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">Axillary region relationship schematic</title><desc id="desc">Median, ulnar and radial nerves have variable positions around the axillary artery. The musculocutaneous nerve is commonly found separately between biceps and coracobrachialis. No fixed compass or clock positions are shown.</desc><rect width="900" height="700" fill="#f7fafc"/><text x="40" y="55" fill="#173045" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Axillary region</text><text x="40" y="89" fill="#526477" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Relationship groups; left-to-right order is not an anatomical axis.</text><rect x="40" y="108" width="820" height="44" rx="10" fill="#e1f3f2"/><text x="58" y="137" fill="#087e83" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">RELATIONSHIP MAP · NOT AN ULTRASOUND IMAGE · NOT TO SCALE</text><rect x="45" y="218" width="447" height="308" rx="16" fill="#ffffff" stroke="#b6c6d1"/><rect x="70" y="242" width="397" height="87" rx="15" fill="#fff1b8" stroke="#b6c6d1"/><text x="268.5" y="292.5" fill="#173045" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Median · ulnar · radial nerves</text><text x="269" y="366" fill="#526477" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">VARIABLE RELATIONS AROUND</text><rect x="125" y="399" width="287" height="81" rx="15" fill="#fce1e0" stroke="#b6c6d1"/><text x="268.5" y="446.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Axillary artery</text><rect x="520" y="244" width="335" height="228" rx="15" fill="#fff1b8" stroke="#b6c6d1"/><text x="687.5" y="321.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Musculocutaneous nerve</text><text x="687.5" y="350.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">commonly separate,</text><text x="687.5" y="379.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">between biceps and</text><text x="687.5" y="408.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">coracobrachialis</text><text x="40" y="593" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Trace nerves to establish identity; do not infer identity from a clock position.</text><text x="40" y="619" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Venous structures and anatomical variants are omitted from this concept map.</text><text x="40" y="674" fill="#526477" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sources: RA-UK Plan A upper-limb factsheet; Royse et al. 2006 (PMID 16617641).</text></svg>