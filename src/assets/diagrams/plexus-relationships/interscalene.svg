<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">Interscalene region relationship schematic</title><desc id="desc">Conceptual transverse neck relationship: plexus lies between anterior and middle scalene muscles, deep to sternocleidomastoid. No needle, target or procedural route is represented.</desc><rect width="900" height="700" fill="#f7fafc"/><text x="40" y="55" fill="#173045" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Interscalene region</text><text x="40" y="89" fill="#526477" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Typical relationships in the neck; selected structures only.</text><rect x="40" y="108" width="820" height="44" rx="10" fill="#e1f3f2"/><text x="58" y="137" fill="#087e83" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">RELATIONSHIP MAP · NOT AN ULTRASOUND IMAGE · NOT TO SCALE</text><text x="40" y="194" fill="#526477" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Medial / anterior</text><text x="860" y="194" fill="#526477" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end">Lateral / posterior</text><rect x="130" y="218" width="640" height="66" rx="15" fill="#e7eef4" stroke="#b6c6d1"/><text x="450.0" y="258.0" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Sternocleidomastoid — superficial</text><rect x="55" y="344" width="225" height="130" rx="15" fill="#e7eef4" stroke="#b6c6d1"/><text x="167.5" y="401.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Anterior</text><text x="167.5" y="430.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">scalene</text><rect x="307" y="344" width="286" height="130" rx="15" fill="#fff1b8" stroke="#b6c6d1"/><text x="450.0" y="401.5" fill="#173045" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Plexus roots / trunks</text><text x="450.0" y="430.5" fill="#173045" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">in the scalene interval</text><rect x="620" y="344" width="225" height="130" rx="15" fill="#e7eef4" stroke="#b6c6d1"/><text x="732.5" y="401.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Middle</text><text x="732.5" y="430.5" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">scalene</text><text x="450" y="322" fill="#526477" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">DEEP TO STERNOCLEIDOMASTOID</text><text x="450" y="530" fill="#173045" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Root number, appearance and intervening vessels vary.</text><text x="40" y="593" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">A relationship aid, not a complete anatomical section or scanning template.</text><text x="40" y="619" fill="#526477" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Nerves and vessels require individual identification; no injection site is shown.</text><text x="40" y="674" fill="#526477" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sources: RA-UK Plan A upper-limb factsheet; Royse et al. 2006 (PMID 16617641).</text></svg>